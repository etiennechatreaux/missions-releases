<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Missions — le site a déménagé</title>
<link rel="canonical" href="https://missions-mac.vercel.app/">
<meta http-equiv="refresh" content="0; url=https://missions-mac.vercel.app/">
<link rel="icon" href="assets/icon.png">
<style>
  :root { color-scheme: light dark; --bg:#ffffff; --fg:#1c1c1e; --muted:#6b6b70; --accent:#2f6fed; --accent-fg:#ffffff; }
  @media (prefers-color-scheme: dark) { :root { --bg:#131316; --fg:#f2f2f5; --muted:#a1a1aa; --accent:#6ea0ff; --accent-fg:#131316; } }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; padding:2rem;
         background:var(--bg); color:var(--fg);
         font:16px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }
  main { max-width:32rem; text-align:center; }
  img { width:72px; height:72px; border-radius:16px; }
  h1 { font-size:1.4rem; margin:1.25rem 0 .5rem; letter-spacing:-.01em; }
  p { color:var(--muted); margin:0 0 1.75rem; }
  a.btn { display:inline-block; padding:.7rem 1.25rem; border-radius:10px; font-weight:600;
          text-decoration:none; background:var(--accent); color:var(--accent-fg); }
  small { display:block; margin-top:1.5rem; color:var(--muted); }
  small a { color:inherit; }
</style>
</head>
<body>
<main>
  <img src="assets/icon.png" alt="">
  <h1>Missions a un nouveau site</h1>
  <p>Le téléchargement, les captures et les notes de version vivent désormais sur missions-mac.vercel.app.</p>
  <a class="btn" href="https://missions-mac.vercel.app/">Ouvrir le site</a>
  <small>Ce dépôt continue d'héberger les binaires et le <a href="appcast.xml">flux de mises à jour</a> : les mises à jour automatiques ne changent pas.</small>
</main>
</body>
</html>
